<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя ❤️</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        h1 {
            font-size: 50px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,0,0,0.3);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        p {
            font-size: 24px;
            color: #fff;
        }
        button {
            background-color: #ff6b6b;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(255,107,107,0.4);
            margin-top: 20px;
        }
        button:hover {
            transform: scale(1.1);
            background-color: #ff4757;
            box-shadow: 0 8px 25px rgba(255,107,107,0.6);
        }
        .heart {
            color: #ff0000;
            font-size: 30px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <h1>Привет, моя любовь ❤️</h1>
    <p>Я сделал этот сайт специально для тебя</p>
    <div class="heart">❤️ ❤️ ❤️</div>
    <button onclick="window.location.href='surprise.html'">Открыть сюрприз 🎁</button>
</body>
</html>
